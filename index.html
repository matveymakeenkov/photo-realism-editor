<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фото-реализм</title>
<style>
  :root { --bg:#16171a; --panel:#1f2125; --line:#33363c; --text:#e6e6e6; --dim:#9a9da3; --accent:#e0a458; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; }
  aside { width: 320px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  main { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 16px; position: relative; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 18px 0 6px; font-weight: 600; }
  .row { margin: 8px 0; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .row output { color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  button { background: #2b2e34; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #353940; }
  button.primary { background: var(--accent); color: #1b1408; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; }
  .wide { grid-column: 1 / -1; }
  canvas { max-width: 100%; max-height: 100%; display: none; box-shadow: 0 4px 30px #000a; }
  #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 48px 32px; text-align: center; color: var(--dim); max-width: 420px; }
  #drop b { color: var(--text); display: block; font-size: 16px; margin-bottom: 6px; }
  main.over #drop, main.over canvas { outline: 2px solid var(--accent); outline-offset: 6px; }
  #status { position: absolute; left: 16px; bottom: 10px; color: var(--dim); font-size: 12px; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 14px; }
  @media (max-width: 720px) { body { flex-direction: column-reverse; } aside { width: 100%; max-height: 50%; border-right: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <h1>Фото-реализм</h1>
  <div class="btns">
    <button id="open" class="wide">Открыть фото…</button>
    <button id="auto" class="wide" disabled title="Подобрать настройки под это фото">✨ Авто</button>
    <button id="compare" disabled title="Удерживайте, чтобы увидеть оригинал">Оригинал (держать)</button>
    <button id="save" class="primary" disabled>Сохранить JPG</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
  <div id="controls"></div>
  <div class="btns">
    <button id="preset">Как в примере</button>
    <button id="reset">Сбросить всё</button>
  </div>
  <p class="hint">Фото можно перетащить в окно или вставить через Ctrl+V. Всё обрабатывается на вашем компьютере, файл никуда не отправляется.</p>
</aside>
<main id="main">
  <div id="drop"><b>Перетащите фото сюда</b>или нажмите «Открыть фото…»</div>
  <canvas id="view"></canvas>
  <div id="status"></div>
</main>

<script>
// name, label, min, max, step, value in the "example" preset, neutral value
const CONTROLS = [
  ['Оптика'],
  ['soft',    'Мягкость оптики',        0, 100, 1, 45, 0],
  ['ca',      'Хроматическая аберрация', 0, 50, 1, 12, 0],
  ['vig',     'Виньетка',               0, 60, 1, 13, 0],
  ['Свет'],
  ['bloom',   'Засветка от ярких зон',  0, 100, 1, 30, 0],
  ['haze',    'Дымка (контровой свет)', 0, 30, 1, 2, 0],
  ['exp',     'Экспозиция',           -100, 100, 1, 0, 0],
  ['Тени'],
  ['shadows', 'Глубина теней',        -50, 50, 1, 0, 0],
  ['contact', 'Контактные тени',        0, 100, 1, 0, 0],
  ['volume',  'Объём',                  0, 100, 1, 0, 0],
  ['stint',   'Оттенок теней (тёпл ↔ холод)', -50, 50, 1, 0, 0],
  ['Зерно'],
  ['grain',   'Зерно',                  0, 80, 1, 20, 0],
  ['cgrain',  'Цветной шум',            0, 40, 1, 8, 0],
  ['gsize',   'Размер зерна',           1, 3, 0.5, 1, 1],
  ['Тон и цвет'],
  ['contrast','Контраст',             -30, 40, 1, 10, 0],
  ['sat',     'Насыщенность',         -50, 50, 1, 4, 0],
  ['warm',    'Теплота',              -50, 50, 1, 0, 0],
  ['fade',    'Блёклые чёрные',         0, 15, 0.5, 0.5, 0],
];

const $ = id => document.getElementById(id);
const view = $('view'), vctx = view.getContext('2d');
const inputs = {};
let srcImg = null;      // full-size source canvas
let pending = false, showOriginal = false, fileName = 'photo';
const PREVIEW_MAX_PIXELS = 1.8e6;

// ---------- UI ----------
const box = $('controls');
for (const c of CONTROLS) {
  if (c.length === 1) { const h = document.createElement('h2'); h.textContent = c[0]; box.append(h); continue; }
  const [name, label, min, max, step, def] = c;
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label><span>${label}</span><output></output></label><input type="range" min="${min}" max="${max}" step="${step}" value="${def}">`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  const upd = () => { out.textContent = inp.value; };
  inp.addEventListener('input', () => { upd(); schedule(); });
  inp.addEventListener('dblclick', () => { inp.value = def; upd(); schedule(); });
  inp._upd = upd; upd();
  inputs[name] = inp; box.append(row);
}
function setAll(idx) { for (const c of CONTROLS) if (c.length > 1) { inputs[c[0]].value = c[idx]; inputs[c[0]]._upd(); } schedule(); }
$('preset').onclick = () => setAll(5);
$('reset').onclick = () => setAll(6);
const params = () => Object.fromEntries(Object.entries(inputs).map(([k, v]) => [k, +v.value]));

// ---------- loading ----------
$('open').onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
const main = $('main');
main.addEventListener('dragover', e => { e.preventDefault(); main.classList.add('over'); });
main.addEventListener('dragleave', () => main.classList.remove('over'));
main.addEventListener('drop', e => { e.preventDefault(); main.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
window.addEventListener('paste', e => { for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) return loadFile(it.getAsFile()); });

async function loadFile(file) {
  try {
    const bmp = await createImageBitmap(file);
    fileName = (file.name || 'photo').replace(/\.[^.]+$/, '');
    loadImage(bmp);
  } catch (err) { $('status').textContent = 'Не удалось открыть файл: ' + err.message; }
}
function loadImage(img) {
  srcImg = document.createElement('canvas');
  srcImg.width = img.width; srcImg.height = img.height;
  srcImg.getContext('2d').drawImage(img, 0, 0);
  $('drop').style.display = 'none'; view.style.display = 'block';
  $('save').disabled = $('compare').disabled = $('auto').disabled = false;
  autoNote = '';
  schedule();
}
window.loadImage = loadImage;

// ---------- auto mode ----------
let autoNote = '';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function analyze(src) {
  // global stats on a small copy
  const sw = 256, sh = Math.max(1, Math.round(256 * src.height / src.width));
  const c = document.createElement('canvas'); c.width = sw; c.height = sh;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(src, 0, 0, sw, sh);
  const d = x.getImageData(0, 0, sw, sh).data, n = sw * sh;
  const hist = new Uint32Array(256); let satSum = 0, bright = 0;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const l = 0.299 * r + 0.587 * g + 0.114 * b; hist[l | 0]++;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx > 40) satSum += (mx - mn) / mx;
    if (l > 225) bright++;
  }
  const pct = q => { let s = 0; for (let i = 0; i < 256; i++) { s += hist[i]; if (s >= q * n) return i / 255; } return 1; };
  // fine detail on a full-resolution centre crop: noise level and sharpness
  const cw = Math.min(src.width, 900), ch = Math.min(src.height, 900);
  const f = document.createElement('canvas'); f.width = cw; f.height = ch;
  const fx = f.getContext('2d', { willReadFrequently: true });
  fx.drawImage(src, (src.width - cw) >> 1, (src.height - ch) >> 1, cw, ch, 0, 0, cw, ch);
  const fd = fx.getImageData(0, 0, cw, ch).data;
  const lum = new Float32Array(cw * ch);
  for (let i = 0, j = 0; j < lum.length; i += 4, j++) lum[j] = 0.299 * fd[i] + 0.587 * fd[i + 1] + 0.114 * fd[i + 2];
  const lh = new Uint32Array(512); let cnt = 0;
  for (let yy = 1; yy < ch - 1; yy += 2) for (let xx = 1; xx < cw - 1; xx += 2) {
    const j = yy * cw + xx;
    const v = Math.abs(4 * lum[j] - lum[j - 1] - lum[j + 1] - lum[j - cw] - lum[j + cw]);
    lh[Math.min(511, v * 4 | 0)]++; cnt++;
  }
  const lp = q => { let s = 0; for (let i = 0; i < 512; i++) { s += lh[i]; if (s >= q * cnt) return i / 4; } return 128; };
  return { p2: pct(0.02), p50: pct(0.5), p98: pct(0.98), sat: satSum / n, bright: bright / n, noise: lp(0.5), sharp: lp(0.9), width: src.width };
}
function autoSettings(s) {
  const v = {};
  const range = s.p98 - s.p2;
  v.contrast = Math.round(clamp(8 + (0.9 - range) * 70, 0, 30));
  // nudge the midtones halfway toward a normal exposure, never a full correction
  v.exp = Math.round(clamp(50 * Math.log2(Math.pow(0.45, 2.2) / Math.max(Math.pow(s.p50, 2.2), 1e-4)) * 0.2, -15, 15));
  v.sat = Math.round(clamp((0.36 - s.sat) * 60, -20, 10));
  v.grain = Math.round(clamp(26 - (s.noise - 1.5) * 6, 0, 24));        // less if the photo is already noisy
  v.cgrain = Math.round(v.grain * 0.4);
  v.gsize = s.width < 1800 ? 1 : s.width < 3200 ? 1.5 : 2;
  v.soft = Math.round(clamp((s.sharp - 2.5 * s.noise) * 5, 10, 60));           // soften only what is over-sharp
  v.bloom = s.bright < 0.004 ? 0 : Math.round(clamp(12 + s.bright * 250, 12, 40));
  v.haze = s.bright > 0.06 ? 2 : 0;
  v.shadows = Math.round(clamp((s.p2 - 0.02) * 250, 0, 25));   // deepen only if blacks are weak
  v.contact = 30; v.volume = 20; v.stint = 10;
  v.ca = 10; v.vig = 12; v.warm = 0; v.fade = 0.5;
  return v;
}
$('auto').onclick = () => {
  const s = analyze(srcImg), v = autoSettings(s);
  for (const k in v) { inputs[k].value = v[k]; inputs[k]._upd(); }
  autoNote = ` · авто: шум ${s.noise.toFixed(1)}, резкость ${s.sharp.toFixed(1)}, яркие зоны ${(s.bright * 100).toFixed(1)}%`;
  schedule();
};
window._analyze = analyze;

// ---------- compare / save ----------
const cmp = $('compare');
const setOrig = v => { if (srcImg && showOriginal !== v) { showOriginal = v; schedule(); } };
cmp.addEventListener('pointerdown', () => setOrig(true));
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) cmp.addEventListener(ev, () => setOrig(false));

$('save').onclick = () => {
  $('status').textContent = 'Сохраняю в полном размере…';
  setTimeout(() => {
    const out = document.createElement('canvas');
    process(srcImg, srcImg.width, srcImg.height, params(), out);
    out.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = fileName + '_real.jpg'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      $('status').textContent = `Сохранено: ${a.download} (${out.width}×${out.height})`;
    }, 'image/jpeg', 0.93);
  }, 30);
};

// ---------- render loop ----------
function schedule() { if (!srcImg || pending) return; pending = true; requestAnimationFrame(render); }
function render() {
  pending = false;
  const k = Math.min(1, Math.sqrt(PREVIEW_MAX_PIXELS / (srcImg.width * srcImg.height)));
  const w = Math.round(srcImg.width * k), h = Math.round(srcImg.height * k);
  const t0 = performance.now();
  if (showOriginal) {
    view.width = w; view.height = h; vctx.drawImage(srcImg, 0, 0, w, h);
    $('status').textContent = 'Оригинал';
  } else {
    process(srcImg, w, h, params(), view);
    $('status').textContent = `${srcImg.width}×${srcImg.height}` + (k < 1 ? ` · предпросмотр ${w}×${h}` : '') + ` · ${Math.round(performance.now() - t0)} мс` + autoNote;
  }
}

// ---------- image pipeline ----------
const LIN = new Float32Array(256);
for (let i = 0; i < 256; i++) LIN[i] = Math.pow(i / 255, 2.2);

// fixed gaussian table so grain does not flicker while sliders move
const GAUSS = new Float32Array(1 << 16);
(function () {
  let s = 0x9e3779b9;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < GAUSS.length; i += 2) {
    const u = Math.sqrt(-2 * Math.log(rnd() + 1e-12)), v = 2 * Math.PI * rnd();
    GAUSS[i] = u * Math.cos(v); GAUSS[i + 1] = u * Math.sin(v);
  }
})();

function process(src, w, h, p, outCanvas) {
  const scale = w / 912;   // effects were tuned on a 912px-wide image

  // 1. base image with lens softness
  const base = document.createElement('canvas'); base.width = w; base.height = h;
  const bctx = base.getContext('2d', { willReadFrequently: true });
  bctx.drawImage(src, 0, 0, w, h);
  if (p.soft > 0) {
    bctx.filter = `blur(${(0.6 * scale).toFixed(2)}px)`; bctx.globalAlpha = p.soft / 100;
    bctx.drawImage(src, 0, 0, w, h);
    bctx.filter = 'none'; bctx.globalAlpha = 1;
  }
  const img = bctx.getImageData(0, 0, w, h), d = img.data;

  // 1b. local-average luminance maps for shadow shaping (fine + wide radius)
  let mapS = null, mapW = null;
  if (p.shadows !== 0 || p.contact > 0 || p.volume > 0) {
    const sw = 256, sh = Math.max(1, Math.round(256 * h / w));
    const small = document.createElement('canvas'); small.width = sw; small.height = sh;
    small.getContext('2d').drawImage(base, 0, 0, sw, sh);
    const blurUp = r => {
      // left transparent on purpose: reading back un-premultiplies, which normalises the blur at the borders
      const t = document.createElement('canvas'); t.width = sw; t.height = sh;
      const tc = t.getContext('2d'); tc.filter = `blur(${r}px)`; tc.drawImage(small, 0, 0);
      const b = document.createElement('canvas'); b.width = w; b.height = h;
      const bc = b.getContext('2d', { willReadFrequently: true });
      bc.imageSmoothingQuality = 'high'; bc.drawImage(t, 0, 0, w, h);
      return bc.getImageData(0, 0, w, h).data;
    };
    mapS = blurUp(4); mapW = blurUp(32);
  }

  // 2. bloom map: bright areas, blurred at low resolution, stored linearly
  let bloom = null;
  if (p.bloom > 0) {
    const sw = 256, sh = Math.max(1, Math.round(256 * h / w));
    const small = document.createElement('canvas'); small.width = sw; small.height = sh;
    const sctx = small.getContext('2d', { willReadFrequently: true });
    sctx.drawImage(base, 0, 0, sw, sh);
    const si = sctx.getImageData(0, 0, sw, sh), sd = si.data;
    for (let i = 0; i < sd.length; i += 4) {
      const r = LIN[sd[i]], g = LIN[sd[i + 1]], b = LIN[sd[i + 2]];
      let m = (0.2126 * r + 0.7152 * g + 0.0722 * b - 0.65) / 0.35; m = m < 0 ? 0 : m > 1 ? 1 : m;
      sd[i] = r * m * 255; sd[i + 1] = g * m * 255; sd[i + 2] = b * m * 255;
    }
    sctx.putImageData(si, 0, 0);
    const mix = document.createElement('canvas'); mix.width = sw; mix.height = sh;
    const mctx = mix.getContext('2d');
    mctx.fillStyle = '#000'; mctx.fillRect(0, 0, sw, sh);
    mctx.globalCompositeOperation = 'lighter';
    mctx.filter = `blur(${(sw / 28).toFixed(1)}px)`; mctx.globalAlpha = 0.69; mctx.drawImage(small, 0, 0);
    mctx.filter = `blur(${(sw / 9).toFixed(1)}px)`;  mctx.globalAlpha = 0.31; mctx.drawImage(small, 0, 0);
    const big = document.createElement('canvas'); big.width = w; big.height = h;
    const gctx = big.getContext('2d', { willReadFrequently: true });
    gctx.imageSmoothingQuality = 'high'; gctx.drawImage(mix, 0, 0, w, h);
    bloom = gctx.getImageData(0, 0, w, h).data;
  }

  // 3. low-res luminance grain field (bilinear upsampled for bigger grain)
  const gs = p.gsize, gw = Math.ceil(w / gs) + 2, gh = Math.ceil(h / gs) + 2;
  const field = new Float32Array(gw * gh);
  let seed = 12345;
  const next = () => { seed = Math.imul(seed, 1664525) + 1013904223 | 0; return seed >>> 16; };
  for (let i = 0; i < field.length; i++) field[i] = GAUSS[next()];
  const gNorm = gs > 1 ? 1.5 : 1;

  const bloomK = p.bloom / 100 * 1.07 / 255;
  const haze = p.haze / 100 * 0.25, hazeAdd = p.haze / 100 * 0.1;
  const ca = p.ca / 10000, vig = p.vig / 100;
  const gAmt = p.grain / 1000 * gNorm, cAmt = p.cgrain / 1000;
  const expGain = Math.pow(2, p.exp / 50);
  const warmR = 1 + p.warm / 50 * 0.12, warmB = 1 - p.warm / 50 * 0.12;
  const con = p.contrast / 100, sat = 1 + p.sat / 100, fade = p.fade / 100;
  const cx = (w - 1) / 2, cy = (h - 1) / 2;
  const shK = p.shadows / 100 * 0.7, ctK = p.contact / 100 * 2.5, volK = p.volume / 100 * 2.0, tintK = p.stint / 50 * 0.15;
  const src8 = ca > 0 ? new Uint8ClampedArray(d) : d;
  const samp = (x, y, c) => {     // bilinear sample of one channel
    x = x < 0 ? 0 : x > w - 1.001 ? w - 1.001 : x; y = y < 0 ? 0 : y > h - 1.001 ? h - 1.001 : y;
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, i = (y0 * w + x0) * 4 + c;
    return (src8[i] * (1 - fx) + src8[i + 4] * fx) * (1 - fy) + (src8[i + w * 4] * (1 - fx) + src8[i + w * 4 + 4] * fx) * fy;
  };
  const TWO_PI = 2 * Math.PI, INV_G = 1 / 2.2;

  for (let y = 0, i = 0; y < h; y++) {
    const dy = (y - cy) / cy, gy = y / gs, gy0 = gy | 0, gfy = gy - gy0;
    for (let x = 0; x < w; x++, i += 4) {
      let r, g, b;
      if (ca > 0) {
        r = LIN[samp(cx + (x - cx) * (1 + ca), cy + (y - cy) * (1 + ca), 0) + 0.5 | 0];
        g = LIN[src8[i + 1]];
        b = LIN[samp(cx + (x - cx) * (1 - ca), cy + (y - cy) * (1 - ca), 2) + 0.5 | 0];
      } else { r = LIN[d[i]]; g = LIN[d[i + 1]]; b = LIN[d[i + 2]]; }

      if (mapS) {
        const L = (0.299 * src8[i] + 0.587 * src8[i + 1] + 0.114 * src8[i + 2]) / 255;
        const Ls = (0.299 * mapS[i] + 0.587 * mapS[i + 1] + 0.114 * mapS[i + 2]) / 255;
        let m = 1;
        if (shK !== 0) m *= 1 - shK * (1 - Ls) * (1 - Ls);
        if (ctK > 0 && Ls > L) { const k = ctK * (Ls - L); m *= 1 - (k > 0.6 ? 0.6 : k); }
        if (volK > 0) m *= Math.exp(volK * (Ls - (0.299 * mapW[i] + 0.587 * mapW[i + 1] + 0.114 * mapW[i + 2]) / 255));
        r *= m; g *= m; b *= m;
      }
      if (tintK !== 0) {
        const q = 1 - (0.299 * src8[i] + 0.587 * src8[i + 1] + 0.114 * src8[i + 2]) / 255, t = tintK * q * q;
        r *= 1 - t; b *= 1 + t;
      }
      if (bloom) { r += bloom[i] * bloomK; g += bloom[i + 1] * bloomK * 0.82; b += bloom[i + 2] * bloomK * 0.62; }
      if (haze > 0) { r = r * (1 - haze) + hazeAdd; g = g * (1 - haze) + hazeAdd * 0.93; b = b * (1 - haze) + hazeAdd * 0.82; }
      if (vig > 0) {
        const dx = (x - cx) / cx; let q = (dx * dx + dy * dy) / 2; q = q > 1 ? 1 : q;
        const v = 1 - vig * Math.pow(q, 1.3); r *= v; g *= v; b *= v;
      }
      r *= expGain * warmR; g *= expGain; b *= expGain * warmB;

      if (gAmt > 0 || cAmt > 0) {
        let n = 0;
        if (gAmt > 0) {
          const gx = x / gs, gx0 = gx | 0, gfx = gx - gx0, j = gy0 * gw + gx0;
          n = ((field[j] * (1 - gfx) + field[j + 1] * gfx) * (1 - gfy) + (field[j + gw] * (1 - gfx) + field[j + gw + 1] * gfx) * gfy) * gAmt;
        }
        r += Math.sqrt(r + 0.002) * (n + cAmt * GAUSS[next()]);
        g += Math.sqrt(g + 0.002) * (n + cAmt * GAUSS[next()]);
        b += Math.sqrt(b + 0.002) * (n + cAmt * GAUSS[next()]);
      }

      // tone: gamma, soft highlight shoulder, S-curve, faded blacks
      r = Math.pow(r > 0 ? r : 0, INV_G); g = Math.pow(g > 0 ? g : 0, INV_G); b = Math.pow(b > 0 ? b : 0, INV_G);
      if (r > 0.8) r = 0.8 + (1 - Math.exp(-(r - 0.8) / 0.2)) * 0.2;
      if (g > 0.8) g = 0.8 + (1 - Math.exp(-(g - 0.8) / 0.2)) * 0.2;
      if (b > 0.8) b = 0.8 + (1 - Math.exp(-(b - 0.8) / 0.2)) * 0.2;
      if (con !== 0) {
        r += con * Math.sin(TWO_PI * (r - 0.5)) / Math.PI;
        g += con * Math.sin(TWO_PI * (g - 0.5)) / Math.PI;
        b += con * Math.sin(TWO_PI * (b - 0.5)) / Math.PI;
      }
      if (fade > 0) { r = fade + r * (1 - fade); g = fade + g * (1 - fade); b = fade + b * (1 - fade); }
      if (sat !== 1) { const l = 0.299 * r + 0.587 * g + 0.114 * b; r = l + (r - l) * sat; g = l + (g - l) * sat; b = l + (b - l) * sat; }

      d[i] = r * 255 + 0.5; d[i + 1] = g * 255 + 0.5; d[i + 2] = b * 255 + 0.5; d[i + 3] = 255;
    }
  }
  outCanvas.width = w; outCanvas.height = h;
  outCanvas.getContext('2d').putImageData(img, 0, 0);
}
